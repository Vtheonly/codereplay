<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CodeReplay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="steps">
      <header>
        <h1 id="project-name">CodeReplay</h1>
        <div id="session-meta"></div>
      </header>
      <ol id="step-list"></ol>
    </aside>

    <main id="center">
      <div id="step-header">
        <button id="prev" title="Previous (←)">← Prev</button>
        <span id="step-title"></span>
        <button id="next" title="Next (→)">Next →</button>
      </div>
      <div id="file-tabs"></div>
      <div id="diff"></div>
    </main>

    <section id="explanation">
      <div id="md"></div>
      <div id="diagram"></div>
      <div id="math"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.2.0/dist/mermaid.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  <script src="/app.js"></script>
</body>
</html>
